    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, limit, doc, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBJnkrBjbCivsCjFC2DyMRfv0ssXA9ZONs",
            authDomain: "telulas-dd5c8.firebaseapp.com",
            projectId: "telulas-dd5c8",
            storageBucket: "telulas-dd5c8.firebasestorage.app",
            messagingSenderId: "619593885912",
            appId: "1:619593885912:web:27d14bea00aab6fd574fad"
        };

        const AGORA_APP_ID = "21d5fa0e054846bda5a547efebf73e6c";
        const AGORA_CHANNEL = "telulas-gank-rw13"; 
        
        let AGORA_TOKEN = ""; 
        let agoraClient = null;
        let localAudioTrack = null;
        let localAgoraUid = null; 
        
        // Menyimpan objek track audio jarak jauh
        let remoteAudioTracks = {};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUserUid = null;
        let onlineUserCount = 0;
        let processedSosIds = [];

        function unlockAudioContext() {
            if (typeof Tone !== 'undefined' && Tone.context.state !== 'running') Tone.start();
        }
        document.body.addEventListener('touchstart', unlockAudioContext, { once: true });
        document.body.addEventListener('click', unlockAudioContext, { once: true });

        signInAnonymously(auth).then((userCredential) => {
            currentUserUid = userCredential.user.uid;
            setupPresence(); 
            listenToOnlineUsers(); 
            fetchLatestAgoraToken(); 
            listenToActiveSlots(); 
        }).catch((error) => {
            alert("GAGAL LOGIN FIREBASE: " + error.message);
        });

        function listenToActiveSlots() {
            const slotsCol = collection(db, "active_slots");
            onSnapshot(slotsCol, (snapshot) => {
                voiceSlots = Array.from({length: MAX_SLOTS}, (_, i) => {
                    return { id:i, occupied:false };
                });

                initialOccupants.forEach((occ, i) => {
                    voiceSlots[i] = { id:i, occupied:true, isSelf:false, ...occ };
                });

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const slotId = data.slotId;
                    if (slotId >= 0 && slotId < MAX_SLOTS) {
                        voiceSlots[slotId] = {
                            id: slotId,
                            occupied: true,
                            isSelf: (data.uid === currentUserUid),
                            name: data.name,
                            role: data.location,
                            initials: data.name.substring(0, 2).toUpperCase(),
                            gradient: 'from-emerald-400 to-emerald-600',
                            isSpeaking: false, 
                            isMuted: false, 
                            mutedByAdmin: false,
                            agoraUid: data.agoraUid
                        };
                    }
                });

                if (joinedSlotIndex !== null && voiceSlots[joinedSlotIndex]) {
                    voiceSlots[joinedSlotIndex].isSelf = true;
                }

                renderVoiceGrid();
            });
        }

        window.openAdminTokenModal = async () => {
            document.getElementById('admin-token-modal').classList.remove('hidden');
            document.getElementById('admin-pin-section').classList.remove('hidden');
            document.getElementById('admin-token-section').classList.add('hidden');
            document.getElementById('admin-pin-input').value = '';
        };

        window.closeAdminTokenModal = () => {
            document.getElementById('admin-token-modal').classList.add('hidden');
        };

        window.verifyAdminPin = () => {
            const pin = document.getElementById('admin-pin-input').value;
            if (pin === "1234") {
                document.getElementById('admin-pin-section').classList.add('hidden');
                document.getElementById('admin-token-section').classList.remove('hidden');
                document.getElementById('new-agora-token').value = AGORA_TOKEN;
                
                const disp = document.getElementById('current-token-display');
                if (AGORA_TOKEN) disp.textContent = AGORA_TOKEN.substring(0, 10) + "...";
                else disp.textContent = "Belum ada / Kosong";
            } else {
                alert("PIN Admin Salah!");
            }
        };

        window.saveAgoraToken = async () => {
            const newToken = document.getElementById('new-agora-token').value.trim();
            if (!newToken) return alert("Token tidak boleh kosong!");
            
            try {
                await setDoc(doc(db, "config", "agora"), { token: newToken });
                AGORA_TOKEN = newToken;
                showToast("Token berhasil diperbarui untuk semua warga!");
                closeAdminTokenModal();
            } catch (e) {
                alert("Gagal simpan token: " + e.message);
            }
        };

        async function fetchLatestAgoraToken() {
            try {
                const docSnap = await getDoc(doc(db, "config", "agora"));
                if (docSnap.exists() && docSnap.data().token) {
                    AGORA_TOKEN = docSnap.data().token;
                }
            } catch (e) {
                console.error("Gagal ambil token:", e);
            }
        }

        function setupPresence() {
            if (!currentUserUid) return;
            const userDocRef = doc(db, "presence", currentUserUid);
            const updateStatus = () => setDoc(userDocRef, { lastSeen: Date.now() }, { merge: true }).catch(console.error);
            updateStatus();
            setInterval(() => { if (document.visibilityState === 'visible') updateStatus(); }, 30000);
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') updateStatus(); });
            window.addEventListener('beforeunload', () => { setDoc(userDocRef, { lastSeen: 0 }, { merge: true }); });
        }

        function listenToOnlineUsers() {
            const presenceCol = collection(db, "presence");
            onSnapshot(presenceCol, (snapshot) => {
                const now = Date.now();
                let count = 0;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.lastSeen && (now - data.lastSeen < 65000)) count++;
                });
                onlineUserCount = count;
                updateCounters(); 
            });
        }

        const MAX_SLOTS = 50;
        const DEFAULT_VISIBLE = 6;
        let isVoiceGridExpanded = false;
        let userProfile = { name: 'Warga', location: 'Ronda' }; 

        const initialOccupants = [
            { name:'Pak RT 01',  role:'Pos Kamling', initials:'R1', gradient:'from-emerald-500 to-teal-700', isSpeaking:true,  isMuted:false, mutedByAdmin:false },
            { name:'Mas Dimas',  role:'RT 01',       initials:'MD', gradient:'from-sky-500 to-indigo-700',   isSpeaking:false, isMuted:false, mutedByAdmin:false },
            { name:'Pak RT 02',  role:'Pos Ronda',   initials:'R2', gradient:'from-amber-500 to-orange-700', isSpeaking:false, isMuted:true,  mutedByAdmin:true  },
            { name:'Wildan',     role:'RT 02',       initials:'WL', gradient:'from-indigo-500 to-purple-700', isSpeaking:false, isMuted:false, mutedByAdmin:false },
            { name:'Bu Sari',    role:'RT 01',       initials:'BS', gradient:'from-fuchsia-500 to-purple-700', isSpeaking:false, isMuted:false, mutedByAdmin:false },
            { name:'Mas Yudi',   role:'RT 02',       initials:'MY', gradient:'from-cyan-500 to-blue-700',    isSpeaking:false, isMuted:false, mutedByAdmin:false },
        ];

        let voiceSlots = Array.from({length: MAX_SLOTS}, (_, i) => {
            const occ = initialOccupants[i];
            return occ ? { id:i, occupied:true, isSelf:false, ...occ } : { id:i, occupied:false };
        });

        let joinedSlotIndex = null;
        let isMicMuted = false;
        let isSpeakerOn = true;
        let selectedSosCategory = 'Maling / Pencurian';
        let pendingJoinSlotIndex = null;
        let wakeLock = null;
        let targetAdminSlotIndex = null;
        let sosSirenInterval = null;

        window.openSosModal = openSosModal; window.closeSosModal = closeSosModal; window.selectSosCategory = selectSosCategory;
        window.dismissPushBanner = dismissPushBanner; window.stopSosSiren = stopSosSiren; window.shareToWhatsApp = shareToWhatsApp;
        window.toggleVoiceGrid = toggleVoiceGrid; window.toggleMic = toggleMic; window.toggleSpeaker = toggleSpeaker;
        window.leaveSlot = leaveSlot; window.openAdminModal = openAdminModal; window.closeAdminModal = closeAdminModal;
        window.toggleTargetMute = toggleTargetMute; window.openJoinModal = openJoinModal; window.closeJoinModal = closeJoinModal;
        window.confirmJoin = confirmJoin; window.submitChatForm = submitChatForm; window.sendQuickChat = sendQuickChat;
        window.forceAudioPlay = forceAudioPlay;

        const $ = id => document.getElementById(id);
        const countJoined = () => voiceSlots.filter(s => s.occupied).length;

        function updateCounters() {
            const n = countJoined();
            $('voice-counter').textContent = `${n}/${MAX_SLOTS}`;
            $('online-count-text').textContent = `${onlineUserCount} Warga Online`;
        }

        function toggleVoiceGrid() {
            isVoiceGridExpanded = !isVoiceGridExpanded;
            const btnIcon = $('btn-toggle-grid').querySelector('svg');
            const btnText = $('toggle-text');
            const container = $('voice-grid').parentElement;
            if (isVoiceGridExpanded) {
                container.classList.replace('max-h-[225px]', 'max-h-[350px]');
                btnIcon.setAttribute('data-lucide', 'chevron-up');
                btnText.textContent = 'Sembunyikan Slot Lainnya';
            } else {
                container.classList.replace('max-h-[350px]', 'max-h-[225px]');
                btnIcon.setAttribute('data-lucide', 'chevron-down');
                btnText.textContent = `Lihat Semua ${MAX_SLOTS} Slot`;
            }
            renderVoiceGrid(); lucide.createIcons();
        }

        function shareToWhatsApp() {
            const text = "Ayo gabung ronda malam Nguling RW 13 di *Telulas Gank*! Klik link ini: \n\n" + window.location.href;
            window.open("https://wa.me/?text=" + encodeURIComponent(text), '_blank');
        }

        function renderVoiceGrid() {
            const grid = $('voice-grid');
            grid.innerHTML = '';
            const slotsToRender = isVoiceGridExpanded ? voiceSlots : voiceSlots.slice(0, DEFAULT_VISIBLE);

            slotsToRender.forEach(slot => {
                if (slot.occupied) {
                    const isAdminMuted = slot.isMuted && slot.mutedByAdmin;
                    const cardStyle = slot.isSelf ? 'glass-card-self' : (isAdminMuted ? 'glass-card border-purple-500/40 shadow-[0_0_15px_rgba(168,85,247,0.15)]' : 'glass-card');
                    const activeRings = (slot.isSpeaking && !slot.isMuted) ? `<div class="speaking-ring"></div><div class="speaking-ring-delay"></div>` : '';
                    const statusBadgeBg = isAdminMuted ? 'bg-purple-500' : (slot.isMuted ? 'bg-rose-500' : 'bg-emerald-500');
                    const statusBadge = isAdminMuted ? `<i data-lucide="shield-alert" class="w-2 h-2 text-white"></i>` : (slot.isMuted ? `<i data-lucide="mic-off" class="w-2 h-2 text-white"></i>` : (slot.isSpeaking ? `<span class="w-1 h-1 rounded-full bg-white animate-pulse"></span>` : `<i data-lucide="volume-2" class="w-2 h-2 text-white"></i>`));
                    const adminBadge = slot.isSelf ? `<i data-lucide="crown" class="w-3 h-3 text-amber-400 absolute -top-1.5 left-1/2 -translate-x-1/2 bg-night-900 rounded-full p-0.5 border border-slate-700 z-10"></i>` : '';
                    const isClickable = (joinedSlotIndex !== null && !slot.isSelf);
                    const cursorClass = isClickable ? 'cursor-pointer' : '';
                    const roleText = isAdminMuted ? `<p class="text-[8px] text-purple-400 font-bold bg-purple-500/10 px-1 py-0.5 rounded-sm mt-0.5 truncate max-w-full">Mute Admin</p>` : `<p class="text-[8px] ${slot.isSelf ? 'text-emerald-400 font-semibold' : 'text-slate-400'} truncate max-w-full leading-tight mt-0.5">${slot.role}</p>`;

                    const card = document.createElement('div');
                    card.className = `${cardStyle} ${cursorClass} rounded-2xl p-2 flex flex-col items-center justify-center relative transition-all duration-300`;
                    card.innerHTML = `
                        <div class="relative mb-1 mt-1">
                            ${activeRings} ${adminBadge}
                            <div class="w-9 h-9 rounded-full bg-gradient-to-br ${slot.gradient} flex items-center justify-center text-white font-bold text-[11px] shadow-md border border-white/20 ${isAdminMuted ? 'opacity-60 grayscale-[50%]' : ''}">${slot.initials}</div>
                            <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full ${statusBadgeBg} border-2 border-night-900 flex items-center justify-center z-10">${statusBadge}</span>
                        </div>
                        <p class="text-[10px] font-bold text-white truncate max-w-full text-center leading-tight">${slot.isSelf ? 'Anda' : slot.name}</p>
                        ${roleText}`;
                    
                    if (isClickable) card.onclick = () => openAdminModal(slot.id);
                    grid.appendChild(card);
                } else {
                    const emptyBtn = document.createElement('button');
                    emptyBtn.type = 'button'; emptyBtn.onclick = () => openJoinModal(slot.id);
                    emptyBtn.className = 'glass-slot-empty rounded-2xl p-2 flex flex-col items-center justify-center min-h-[85px] group cursor-pointer focus:outline-none';
                    emptyBtn.innerHTML = `<div class="w-7 h-7 rounded-full bg-emerald-500/15 group-hover:bg-emerald-500 border border-emerald-500/40 flex items-center justify-center mb-1"><i data-lucide="plus" class="w-3.5 h-3.5 text-emerald-400 group-hover:text-white"></i></div><span class="text-[10px] font-bold text-slate-300 group-hover:text-emerald-300">Gabung</span>`;
                    grid.appendChild(emptyBtn);
                }
            });

            lucide.createIcons();
            updateCounters();
            if (joinedSlotIndex !== null) {
                $('admin-hint').innerHTML = `<i data-lucide="shield-check" class="w-3 h-3 text-purple-400"></i> <span class="text-purple-300">Mode Admin</span>`;
            } else {
                $('admin-hint').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Streaming Ronda`;
            }
            lucide.createIcons();
        }

        function openAdminModal(slotId) {
            if (joinedSlotIndex === null || slotId === joinedSlotIndex) return;
            const targetSlot = voiceSlots[slotId];
            if (!targetSlot.occupied) return;
            targetAdminSlotIndex = slotId;
            $('admin-target-avatar').textContent = targetSlot.initials;
            $('admin-target-avatar').className = `w-10 h-10 rounded-full bg-gradient-to-br ${targetSlot.gradient} flex items-center justify-center text-white font-bold text-xs shadow-inner`;
            $('admin-target-name').textContent = targetSlot.name;
            updateAdminModalUI();
            $('admin-modal').classList.remove('hidden');
        }

        function closeAdminModal() { $('admin-modal').classList.add('hidden'); targetAdminSlotIndex = null; }

        function updateAdminModalUI() {
            const targetSlot = voiceSlots[targetAdminSlotIndex];
            if (!targetSlot) return;
            const btn = $('admin-toggle-btn'); const statusTxt = $('admin-target-status');
            if (targetSlot.isMuted) {
                statusTxt.innerHTML = targetSlot.mutedByAdmin ? `<i data-lucide="shield-alert" class="w-3 h-3 inline mr-1"></i> Dibisukan oleh Admin` : 'Sedang Dibisukan (Mandiri)';
                statusTxt.className = targetSlot.mutedByAdmin ? 'text-[11px] text-purple-400 font-bold' : 'text-[11px] text-rose-400 font-semibold';
                btn.className = 'w-full py-3.5 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 bg-emerald-600 text-white shadow-lg border border-emerald-400/40';
                btn.innerHTML = `<i data-lucide="mic" class="w-4 h-4"></i> Aktifkan Suara Peserta`;
            } else {
                statusTxt.textContent = 'Sedang Aktif / Bicara';
                statusTxt.className = 'text-[11px] text-emerald-400 font-semibold';
                btn.className = 'w-full py-3.5 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 bg-rose-600 text-white shadow-lg border border-rose-400/40';
                btn.innerHTML = `<i data-lucide="mic-off" class="w-4 h-4"></i> Bisukan Peserta Ini`;
            }
            lucide.createIcons();
        }

        function toggleTargetMute() {
            if (targetAdminSlotIndex === null) return;
            const targetSlot = voiceSlots[targetAdminSlotIndex];
            targetSlot.isMuted = !targetSlot.isMuted;
            if (targetSlot.isMuted) { targetSlot.isSpeaking = false; targetSlot.mutedByAdmin = true; showToast(`${targetSlot.name} dibisukan oleh Admin.`); }
            else { targetSlot.mutedByAdmin = false; showToast(`Suara ${targetSlot.name} diaktifkan kembali.`); }
            updateAdminModalUI(); renderVoiceGrid();
        }

        function openJoinModal(index) {
            if (joinedSlotIndex !== null) return showToast('Anda sudah terhubung.');
            if (voiceSlots[index].occupied) return;
            if (countJoined() >= MAX_SLOTS) return showToast('Ruang suara penuh.');
            pendingJoinSlotIndex = index; 
            $('user-name-input').value = ''; 
            $('custom-loc-input').value = '';
            $('join-modal').classList.remove('hidden');
            setTimeout(() => $('user-name-input').focus(), 300);
        }

        function closeJoinModal() { $('join-modal').classList.add('hidden'); $('custom-loc-input').blur(); pendingJoinSlotIndex = null; }

        function confirmJoin() {
            const nameVal = $('user-name-input').value.trim();
            const locVal = $('custom-loc-input').value.trim();
            const finalName = nameVal || 'Warga';
            const finalLoc = locVal || 'Ronda Keliling'; 
            const index = pendingJoinSlotIndex; closeJoinModal(); executeJoin(index, finalName, finalLoc);
        }

        async function executeJoin(index, name, location) {
            if (index === null) return;
            if (!AGORA_APP_ID) return alert("App ID Agora belum dimasukkan.");
            if (!AGORA_TOKEN) {
                await fetchLatestAgoraToken();
                if (!AGORA_TOKEN) {
                    return alert("Token Agora belum diatur oleh Admin.");
                }
            }

            try {
                // Konfigurasi Audio Mode untuk Android WebView (Memaksa speaker external/loudspeaker)
                await AgoraRTC.setAudioProfile("speech_standard");
                
                localAgoraUid = Math.floor(Math.random() * 100000000);
                agoraClient = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
                
                await agoraClient.join(AGORA_APP_ID, AGORA_CHANNEL, AGORA_TOKEN, localAgoraUid);
                
                localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack({
                    encoderConfig: "speech_standard",
                    AEC: true, // Acoustic Echo Cancellation
                    AGC: true, // Automatic Gain Control
                    ANS: true  // Automatic Noise Suppression
                });
                
                await agoraClient.publish([localAudioTrack]);

                // ========================================================
                // PERBAIKAN UTAMA: Penanganan Audio Masuk & Playback SDK
                // ========================================================
                agoraClient.on("user-published", async (user, mediaType) => {
                    await agoraClient.subscribe(user, mediaType);
                    if (mediaType === "audio") {
                        remoteAudioTracks[user.uid] = user.audioTrack;
                        
                        // Coba langsung mainkan menggunakan method bawaan Agora SDK
                        try {
                            user.audioTrack.play();
                        } catch (err) {
                            console.log("Autoplay diblokir oleh WebView, butuh interaksi tombol Dengar:", err);
                        }
                        
                        // Munculkan tombol manual "Dengar" sebagai jaminan jika policy android memblokir
                        $('btn-force-audio').classList.remove('hidden');
                    }
                });

                agoraClient.on("user-unpublished", (user, mediaType) => {
                    if (mediaType === "audio" && remoteAudioTracks[user.uid]) {
                        delete remoteAudioTracks[user.uid];
                    }
                });

                agoraClient.enableAudioVolumeIndicator();
                agoraClient.on("volume-indicator", volumes => {
                    volumes.forEach(volume => {
                        const speakingSlot = voiceSlots.find(s => s.agoraUid === volume.uid || (s.isSelf && volume.uid === localAgoraUid));
                        if (speakingSlot) {
                            if (volume.level > 5 && !speakingSlot.isSpeaking) {
                                speakingSlot.isSpeaking = true;
                                renderVoiceGrid();
                            } else if (volume.level <= 5 && speakingSlot.isSpeaking) {
                                speakingSlot.isSpeaking = false;
                                renderVoiceGrid();
                            }
                        }
                    });
                });

                userProfile.name = name; userProfile.location = location;
                joinedSlotIndex = index; isMicMuted = false; isSpeakerOn = true;

                await setDoc(doc(db, "active_slots", currentUserUid), {
                    slotId: index, uid: currentUserUid, agoraUid: localAgoraUid,
                    name: name, location: location, isMuted: false
                });

                voiceSlots[index] = { 
                    id: index, occupied: true, isSelf: true, 
                    name: name, role: location, initials: name.substring(0, 2).toUpperCase(), 
                    gradient: 'from-emerald-400 to-emerald-600', 
                    isSpeaking: false, isMuted: false, mutedByAdmin: false,
                    agoraUid: localAgoraUid
                };

                $('audio-control-bar').classList.remove('hidden');
                $('btn-force-audio').classList.remove('hidden'); 
                updateAudioControlUI(); 
                sendSystemChat(`👑 ${name} bergabung dari: ${location}.`);
                showToast(`Terhubung ke Saluran Suara!`);
                await requestWakeLock();

            } catch (err) {
                console.error("Agora Error:", err);
                alert("GAGAL SUARA: " + err.message);
            }
        }

        // ==========================================
        // FUNGSI PAKSA PUTAR AUDIO (TOMBOL KUNING)
        // ==========================================
        function forceAudioPlay() {
            let count = 0;
            Object.values(remoteAudioTracks).forEach(track => {
                try {
                    track.play();
                    count++;
                } catch (e) {
                    console.error("Gagal play track:", e);
                }
            });
            showToast(count > 0 ? "Audio berhasil diputar ke speaker!" : "Belum ada suara masuk dari warga lain.");
        }

        async function leaveSlot() {
            if (joinedSlotIndex === null) return;

            const localUid = currentUserUid;
            const prevIndex = joinedSlotIndex;

            joinedSlotIndex = null;
            voiceSlots[prevIndex] = { id: prevIndex, occupied: false };
            $('audio-control-bar').classList.add('hidden');
            $('btn-force-audio').classList.add('hidden');
            
            remoteAudioTracks = {};

            renderVoiceGrid();
            showToast('Keluar dari ruang suara');
            sendSystemChat('Anda keluar dari ruang suara.');
            releaseWakeLock();

            try {
                if (localAudioTrack) { 
                    localAudioTrack.stop(); 
                    localAudioTrack.close(); 
                    localAudioTrack = null; 
                }
                if (agoraClient) { 
                    await agoraClient.leave(); 
                    agoraClient = null; 
                }
                await deleteDoc(doc(db, "active_slots", localUid));
            } catch (e) {
                console.error("Error saat keluar:", e);
            }
        }

        async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
        function releaseWakeLock() { if (wakeLock !== null) wakeLock.release().then(() => { wakeLock = null; }); }

        function toggleMic() { 
            if (joinedSlotIndex === null || !localAudioTrack) return; 
            isMicMuted = !isMicMuted; 
            localAudioTrack.setEnabled(!isMicMuted);
            updateAudioControlUI(); 
            showToast(isMicMuted ? 'Mikrofon dibisukan' : 'Mikrofon diaktifkan'); 
        }
        
        function toggleSpeaker() { 
            isSpeakerOn = !isSpeakerOn; 
            Object.values(remoteAudioTracks).forEach(track => {
                // Mematikan/menyalakan pemutaran track audio jarak jauh
                if (!isSpeakerOn) {
                    track.stop();
                } else {
                    track.play();
                }
            });
            updateAudioControlUI(); 
            showToast(isSpeakerOn ? 'Speaker Aktif' : 'Speaker Dibisukan'); 
        }

        function updateAudioControlUI() {
            const btnMute = $('btn-mute'); const btnSpeaker = $('btn-speaker');
            const micLabel = $('mic-status-label'); const spkLabel = $('speaker-status-label');
            const badgeIcon = $('mic-badge-icon'); const badgeBg = $('mic-badge-bg');
            
            if (isMicMuted) {
                btnMute.innerHTML = `<i data-lucide="mic-off" class="w-4 h-4 text-rose-400"></i>`;
                micLabel.textContent = 'Mic Mute'; micLabel.className = 'text-xs font-bold text-rose-300 truncate';
                badgeIcon.setAttribute('data-lucide', 'mic-off'); badgeIcon.setAttribute('class', 'w-3.5 h-3.5 text-rose-400');
                badgeBg.className = 'w-7 h-7 rounded-xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center shrink-0';
            } else {
                btnMute.innerHTML = `<i data-lucide="mic" class="w-4 h-4 text-emerald-400"></i>`;
                micLabel.textContent = 'Mic Aktif'; micLabel.className = 'text-xs font-bold text-white truncate';
                badgeIcon.setAttribute('data-lucide', 'mic'); badgeIcon.setAttribute('class', 'w-3.5 h-3.5 text-emerald-400');
                badgeBg.className = 'w-7 h-7 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center shrink-0';
            }
            
            if (isSpeakerOn) {
                btnSpeaker.innerHTML = `<i data-lucide="volume-2" class="w-4 h-4 text-sky-400"></i>`;
                spkLabel.textContent = 'Speaker: Aktif'; spkLabel.className = 'text-[10px] text-emerald-300/85 truncate';
            } else {
                btnSpeaker.innerHTML = `<i data-lucide="volume-x" class="w-4 h-4 text-slate-400"></i>`;
                spkLabel.textContent = 'Speaker: Off'; spkLabel.className = 'text-[10px] text-slate-400 truncate';
            }
            lucide.createIcons();
        }

        function initFirebaseChat() {
            const q = query(collection(db, "chats"), limit(50));
            onSnapshot(q, (snapshot) => {
                const feed = $('chat-feed');
                const isAtBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight <= 50;
                let chats = [];
                snapshot.forEach((docSnap) => { chats.push({ id: docSnap.id, ...docSnap.data() }); });
                chats.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                feed.innerHTML = '';
                chats.forEach((data) => renderMessageBubble(data, isAtBottom));
                if (isAtBottom) feed.scrollTop = feed.scrollHeight;
                lucide.createIcons();
            }, (error) => { alert("Gagal Memuat Chat: " + error.message); });
        }

        function renderMessageBubble(data, isAtBottom) {
            const feed = $('chat-feed'); const wrapper = document.createElement('div');
            const isSelf = (data.senderUid === currentUserUid);
            wrapper.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'}`;

            if (data.isEmergency) {
                wrapper.className = 'w-full my-1';
                wrapper.innerHTML = `<div class="w-full p-3 rounded-2xl bg-rose-950/75 border border-rose-500/55 shadow-md">
                    <div class="flex items-center justify-between mb-1"><span class="text-[10px] font-extrabold uppercase tracking-wider text-rose-400 flex items-center gap-1"><i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> DARURAT SOS</span><span class="text-[10px] text-rose-300/70">${data.time}</span></div>
                    <p class="text-xs font-semibold text-white">${escapeHTML(data.message)}</p>
                    <button onclick="stopSosSiren()" class="mt-2.5 w-full py-1.5 bg-rose-600/90 text-white text-[10px] font-bold rounded-lg flex items-center justify-center gap-1"><i data-lucide="bell-off" class="w-3 h-3"></i> Hentikan Sirene</button></div>`;
            } else if (isSelf) {
                wrapper.innerHTML = `<div class="flex items-center gap-1.5 mb-1 px-1"><span class="text-[10px] text-slate-500">${data.time}</span><span class="text-[11px] font-bold text-emerald-400">Anda</span></div>
                    <div class="max-w-[82%] px-3.5 py-2 rounded-2xl rounded-tr-sm bg-gradient-to-br from-emerald-600 to-teal-700 text-white text-xs shadow-md border border-emerald-400/30 leading-relaxed">${escapeHTML(data.message)}</div>`;
            } else {
                wrapper.innerHTML = `<div class="flex items-center gap-1.5 mb-1 px-1"><span class="text-[11px] font-bold text-slate-200">${escapeHTML(data.sender)}</span><span class="text-[9px] font-semibold px-1.5 py-0.2 rounded border text-slate-400 bg-slate-500/10 border-slate-500/25">${escapeHTML(data.tag || 'Warga')}</span><span class="text-[10px] text-slate-500">${data.time}</span></div>
                    <div class="max-w-[86%] px-3.5 py-2 rounded-2xl rounded-tl-sm glass-card text-slate-200 text-xs leading-relaxed">${escapeHTML(data.message)}</div>`;
            }
            feed.appendChild(wrapper);
        }

        async function sendChatToDB(text, isEmergency = false) {
            if (!text) return;
            if (!currentUserUid) return alert("Tunggu, sedang menghubungkan ke server...");
            const senderName = joinedSlotIndex !== null ? userProfile.name : 'Warga';
            try {
                await addDoc(collection(db, "chats"), {
                    senderUid: currentUserUid, sender: senderName, message: text, timestamp: Date.now(), time: getCurrentTime(), tag: joinedSlotIndex !== null ? userProfile.location : 'Warga', isEmergency: isEmergency
                });
            } catch (e) { alert("GAGAL KIRIM PESAN: " + e.message); }
        }

        function sendSystemChat(text) { sendChatToDB(text, false); }
        function submitChatForm(e) { e.preventDefault(); const input = $('chat-input'); const val = input.value.trim(); if (!val) return; sendChatToDB(val); input.value = ''; }
        function sendQuickChat(text) { sendChatToDB(text); }

        let holdInterval = null; let holdProgressVal = 0; let lastFocusEl = null;
        function openSosModal() { lastFocusEl = document.activeElement; $('sos-modal').classList.remove('hidden'); resetHoldProgress(); setTimeout(() => { const btn = document.querySelector('.sos-cat-btn'); if (btn) btn.focus(); }, 50); }
        function closeSosModal() { cancelHoldSos(); $('sos-modal').classList.add('hidden'); if (lastFocusEl) lastFocusEl.focus(); }
        function selectSosCategory(btn, category) {
            selectedSosCategory = category;
            document.querySelectorAll('.sos-cat-btn').forEach(el => { el.className = 'sos-cat-btn p-2.5 rounded-2xl border border-slate-700/80 bg-slate-800/60 text-xs font-medium text-slate-300 flex items-center gap-2 transition'; });
            btn.className = 'sos-cat-btn p-2.5 rounded-2xl border border-rose-500/60 bg-rose-500/15 text-xs font-semibold text-white flex items-center gap-2 transition';
        }
        function startHoldSos(e) { if (e) e.preventDefault(); resetHoldProgress(); const progressEl = $('hold-progress'); const labelEl = $('hold-btn-label'); labelEl.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Mengirim...`; lucide.createIcons(); const duration = 1500; const step = 30; holdInterval = setInterval(() => { holdProgressVal += (step / duration) * 100; progressEl.style.width = `${Math.min(holdProgressVal, 100)}%`; if (holdProgressVal >= 100) { clearInterval(holdInterval); triggerEmergencyAlert(); } }, step); }
        function cancelHoldSos() { clearInterval(holdInterval); resetHoldProgress(); }
        function resetHoldProgress() { holdProgressVal = 0; const progressEl = $('hold-progress'); const labelEl = $('hold-btn-label'); if (progressEl) progressEl.style.width = '0%'; if (labelEl) { labelEl.innerHTML = `<i data-lucide="fingerprint" class="w-4 h-4"></i> Tahan 1.5 Detik`; lucide.createIcons(); } }

        async function playSirenTone() { try { if (typeof Tone !== 'undefined') { await Tone.start(); const synth = new Tone.Synth().toDestination(); const now = Tone.now(); synth.triggerAttackRelease("A5", "16n", now); synth.triggerAttackRelease("E5", "16n", now + 0.2); } } catch (err) {} }
        function startSosSiren() { if (sosSirenInterval) clearInterval(sosSirenInterval); playSirenTone(); sosSirenInterval = setInterval(() => playSirenTone(), 1000); }
        function stopSosSiren() { if (sosSirenInterval) { clearInterval(sosSirenInterval); sosSirenInterval = null; showToast('Sirene SOS dihentikan.'); } }

        function showSosUI(reporter, category) {
            $('push-category-text').textContent = category; $('push-reporter-text').textContent = reporter;
            $('push-notification-preview').classList.remove('hidden'); startSosSiren();
            const feed = $('chat-feed'); const wrapper = document.createElement('div'); wrapper.className = 'w-full my-1';
            wrapper.innerHTML = `<div class="w-full p-3 rounded-2xl bg-rose-950/75 border border-rose-500/55 shadow-md">
                <div class="flex items-center justify-between mb-1"><span class="text-[10px] font-extrabold uppercase text-rose-400 flex items-center gap-1"><i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> PERINGATAN SOS</span><span class="text-[10px] text-rose-300/70">${getCurrentTime()}</span></div>
                <p class="text-xs font-semibold text-white">DARURAT (${escapeHTML(category)}) oleh ${escapeHTML(reporter)}. Segera merapat!</p>
                <button onclick="stopSosSiren()" class="mt-2.5 w-full py-1.5 bg-rose-600/90 text-white text-[10px] font-bold rounded-lg flex items-center justify-center gap-1"><i data-lucide="bell-off" class="w-3 h-3"></i> Hentikan Sirene</button></div>`;
            feed.appendChild(wrapper); feed.scrollTop = feed.scrollHeight; lucide.createIcons();
        }

        async function triggerEmergencyAlert() {
            closeSosModal();
            let reporterLabel = 'Warga (Belum Join)';
            if (joinedSlotIndex !== null) { reporterLabel = `${userProfile.name} (${userProfile.location})`; }
            showSosUI(`Anda (${reporterLabel})`, selectedSosCategory);
            
            try {
                await addDoc(collection(db, "sos_alerts"), { 
                    senderUid: currentUserUid, 
                    reporter: reporterLabel, 
                    category: selectedSosCategory, 
                    timestamp: Date.now(), 
                    active: true 
                });
                showToast("SOS Berhasil Dikirim!");
            } catch (e) { alert("Gagal Kirim SOS: " + e.message); }
        }

        function listenIncomingSos() {
            const q = query(collection(db, "sos_alerts"), limit(10));
            onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        const docId = change.doc.id;
                        if (data.senderUid === currentUserUid) return;
                        if (processedSosIds.includes(docId)) return;
                        const timeDiff = Date.now() - (data.timestamp || 0);
                        if (timeDiff > 30000) return; 
                        processedSosIds.push(docId);
                        if (processedSosIds.length > 100) processedSosIds.shift(); 
                        showSosUI(data.reporter, data.category);
                    }
                });
            });
        }

        function dismissPushBanner() { $('push-notification-preview').classList.add('hidden'); stopSosSiren(); }

        let toastTimer;
        function showToast(message) { const toast = $('toast'); $('toast-msg').textContent = message; toast.classList.remove('opacity-0', 'translate-y-2'); toast.classList.add('opacity-100', 'translate-y-0'); clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.classList.remove('opacity-100', 'translate-y-0'); toast.classList.add('opacity-0', 'translate-y-2'); }, 2400); }

        function getCurrentTime() { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
        function escapeHTML(str) { if (!str) return ''; return str.replace(/[&<>'"]/g, tag => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[tag])); }

        window.addEventListener('load', () => {
            renderVoiceGrid(); initFirebaseChat(); listenIncomingSos(); lucide.createIcons();
            const holdBtn = $('hold-sos-btn');
            holdBtn.addEventListener('touchstart', startHoldSos, { passive: false });
            holdBtn.addEventListener('touchend', cancelHoldSos);
            holdBtn.addEventListener('touchcancel', cancelHoldSos);
            holdBtn.addEventListener('mousedown', startHoldSos);
            holdBtn.addEventListener('mouseup', cancelHoldSos);
            holdBtn.addEventListener('mouseleave', cancelHoldSos);

            document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('sos-modal').classList.contains('hidden')) closeSosModal(); if (!$('join-modal').classList.contains('hidden')) closeJoinModal(); if (!$('admin-modal').classList.contains('hidden')) closeAdminModal(); if (!$('admin-token-modal').classList.contains('hidden')) closeAdminTokenModal(); } });
            $('sos-modal').addEventListener('click', e => { if (e.target === $('sos-modal')) closeSosModal(); });
            $('join-modal').addEventListener('click', e => { if (e.target === $('join-modal')) closeJoinModal(); });
            $('admin-modal').addEventListener('click', e => { if (e.target === $('admin-modal')) closeAdminModal(); });
            document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && joinedSlotIndex !== null) await requestWakeLock(); });
        });
    </script>
